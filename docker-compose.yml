# ============================================================
# Odyssey Scheduler — Docker Compose (self-contained, SQLite)
# Usage: docker compose up --build
# The SQLite database persists in the named volume `odyssey-data`.
# ============================================================

services:
  app:
    build: .
    container_name: odyssey-scheduler
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "file:/data/odyssey.db"
      APP_TIMEZONE: "Africa/Lagos"
      TASK_REMINDER_INTERVAL_MINUTES: "30"
      ULTR_INSTANCE_ID: "${ULTR_INSTANCE_ID}"
      ULTRA_TOKEN: "${ULTRA_TOKEN}"
    volumes:
      - odyssey-data:/data

volumes:
  odyssey-data:
