# Render Blueprint — Odyssey Scheduler
# SQLite keeps the app standalone. A persistent disk is required so
# the database survives restarts/redeploys (disks require a paid plan;
# on the free tier the DB resets whenever the service restarts).
#
# The long-running node-cron engine starts automatically with the
# server. On the free tier (which spins down when idle), either keep
# the service awake with an uptime monitor hitting /api/health every
# few minutes, or set CRON_SECRET and schedule an external cron to
# call /api/cron/run every minute.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: odyssey-scheduler
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate && npm run build && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/odyssey.db
      - key: APP_TIMEZONE
        value: Africa/Lagos
      - key: TASK_REMINDER_INTERVAL_MINUTES
        value: "30"
      - key: ULTR_INSTANCE_ID
        sync: false
      - key: ULTRA_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true
    disk:
      name: odyssey-data
      mountPath: /var/data
      sizeGB: 1
