# Render Blueprint — Odyssey Scheduler
# FREE deployment: Render free web service + a free external PostgreSQL
# (e.g. Neon) so task data persists without a paid disk.
#
# Set DATABASE_URL to your Postgres connection string (Neon free tier)
# when Render prompts for the environment variables.
#
# The reminder engine (node-cron) starts with the server, but Render's
# free service spins down when idle. Keep it awake with a free uptime
# monitor (e.g. UptimeRobot) pinging /api/health every 5 minutes, or set
# CRON_SECRET and call /api/cron/run?secret=... every minute externally.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: odyssey-scheduler
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production would otherwise make
    # npm skip devDependencies (prisma CLI, tsx, typescript, tailwind).
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --skip-generate && npm run build && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Lagos
      - key: TASK_REMINDER_INTERVAL_MINUTES
        value: "30"
      - key: ULTR_INSTANCE_ID
        sync: false
      - key: ULTRA_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true
