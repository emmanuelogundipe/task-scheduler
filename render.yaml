# Render Blueprint — In-Office Task Scheduler & Automated Reminder System
# 100% FREE: Render free tier + Render PostgreSQL free tier + UltraMsg free tier
# WhatsApp-only setup: email (SMTP) and Google Calendar env vars are no longer
# required in the Blueprint. Add them later via the Render dashboard if needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: task-scheduler
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-scheduler-db
          property: connectionString
      - key: ULTRA_INSTANCE_ID
        sync: false
      - key: ULTRA_TOKEN
        sync: false
      - key: REMINDER_INTERVAL_MIN
        value: "30"

databases:
  - name: task-scheduler-db
    plan: free
    databaseName: taskscheduler
    user: taskscheduler
