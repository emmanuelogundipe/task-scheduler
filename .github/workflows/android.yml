name: Build Android APK

# Builds a directly-installable debug APK for Odyssey Scheduler.
# Run it from the Actions tab (Run workflow), or it runs automatically
# whenever something under capacitor/ changes. Download the APK from the
# run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'capacitor/**'
      - '.github/workflows/android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons and splash
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync web config
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/odyssey-scheduler.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-scheduler-apk
          path: capacitor/android/app/build/outputs/apk/debug/odyssey-scheduler.apk
          if-no-files-found: error
