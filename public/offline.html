<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odyssey Scheduler — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        border: 1px solid #1e293b;
        background: rgba(15, 23, 42, 0.6);
        border-radius: 16px;
        padding: 32px 24px;
      }
      .logo {
        width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 16px;
        background: #059669; display: flex; align-items: center; justify-content: center;
        font-size: 32px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600;
        background: #059669; color: #fff; font-size: 14px; cursor: pointer;
      }
      button:hover { background: #10b981; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🧭</div>
      <h1>You're offline</h1>
      <p>
        Odyssey Scheduler needs an internet connection to load tasks and send WhatsApp
        reminders. Check your connection and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
